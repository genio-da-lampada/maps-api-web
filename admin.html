<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>caixinha — musicadehoje</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif;
         background: #16213e; color: #fff; min-height: 100vh; }
  header { background: #1a1a2e; padding: 14px 18px;
           display: flex; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header a { color: #9fb3c8; font-size: 13px; text-decoration: none;
             margin-left: auto; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .card { background: #1a1a2e; border: 1px solid #3a3a5e;
          border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  textarea, input { width: 100%; background: #232346; color: #fff;
    border: 1px solid #3a3a5e; border-radius: 10px; padding: 12px;
    font: inherit; font-size: 16px; }
  textarea { min-height: 96px; resize: vertical; }
  textarea::placeholder, input::placeholder { color: #9fb3c8; }
  button { background: #e94560; color: #fff; border: none;
    border-radius: 999px; padding: 12px 20px; font-weight: 700;
    font-size: 15px; cursor: pointer; margin-top: 10px; width: 100%; }
  button:disabled { opacity: .5; }
  .dica { color: #9fb3c8; font-size: 12.5px; margin: 8px 2px 0; }
  .item { border-top: 1px solid #2a2a4e; padding: 12px 2px; }
  .item:first-child { border-top: none; }
  .item .t { font-size: 14px; word-break: break-word; white-space: pre-wrap; }
  .item .m { font-size: 12px; color: #9fb3c8; margin-top: 6px;
             display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { border-radius: 999px; padding: 2px 10px; font-size: 11.5px;
          font-weight: 700; }
  .nova { background: #f0a821; color: #1a1a2e; }
  .processada { background: #0a9d43; color: #fff; }
  .descartada { background: #3a3a5e; color: #9fb3c8; }
  .res { color: #ffd9a1; font-size: 12.5px; margin-top: 4px; }
  #aviso { font-size: 13px; color: #f0a821; min-height: 18px;
           margin-top: 8px; }
  h2 { font-size: 13px; color: #9fb3c8; font-weight: 600;
       margin: 18px 4px 8px; text-transform: lowercase; }
</style>
</head>
<body>
<header>
  <h1>🧞 caixinha</h1>
  <a href="./index.html">← mapa</a>
</header>
<main>
  <div class="card" id="portao" style="display:none">
    <div style="font-size:14px;margin-bottom:8px">cola a chave da casa
      (fica só neste aparelho):</div>
    <input id="chave" type="password" placeholder="chave admin"
      autocomplete="off">
    <button onclick="guardarChave()">guardar 🔑</button>
  </div>

  <div id="painel" style="display:none">
    <h2>⚙️ engine agora</h2>
    <div class="card" id="engine" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      carregando…
    </div>
    <h2>📬 mandar sugestão</h2>
    <div class="card">
      <textarea id="texto" placeholder="cola o link ou @ do lugar e me conta o que você viu…&#10;&#10;ex: instagram.com/tal_bar — samba na varanda, cheio às 21h"></textarea>
      <button id="enviar" onclick="mandar()">mandar pro cláudio 🚀</button>
      <div id="aviso"></div>
      <div class="dica">chega na minha mesa e eu processo no boletim da
        manhã — o resultado aparece aqui embaixo.</div>
    </div>
    <h2>últimas sugestões</h2>
    <div class="card" id="lista">carregando…</div>
  </div>
</main>
<script>
var API = 'https://quxzjsnjgpisepslcpnc.supabase.co/functions/v1/sugestoes';

function chaveAtual() { return localStorage.getItem('mdh_admin_key') || ''; }

function guardarChave() {
  var v = document.getElementById('chave').value.trim();
  if (!v) return;
  localStorage.setItem('mdh_admin_key', v);
  iniciar();
}

function semChave() {
  localStorage.removeItem('mdh_admin_key');
  document.getElementById('portao').style.display = 'block';
  document.getElementById('painel').style.display = 'none';
}

function quando(iso) {
  return new Date(iso).toLocaleString('pt-BR', {
    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
    timeZone: 'America/Sao_Paulo' });
}

function carregar() {
  fetch(API, { headers: { 'x-admin-key': chaveAtual() } })
    .then(function (r) {
      if (r.status === 401) { semChave(); throw new Error('chave'); }
      return r.json();
    })
    .then(function (d) {
      var L = d.sugestoes || [];
      document.getElementById('lista').innerHTML = L.length
        ? L.map(function (s) {
            return '<div class="item"><div class="t">' +
              s.texto.replace(/</g, '&lt;') + '</div>' +
              '<div class="m"><span class="pill ' + s.status + '">' +
              s.status + '</span><span>' + quando(s.criado_em) + '</span></div>' +
              (s.resultado
                ? '<div class="res">🧞 ' + s.resultado.replace(/</g, '&lt;') + '</div>'
                : '') + '</div>';
          }).join('')
        : '<div class="dica">caixinha vazia — manda a primeira!</div>';
    })
    .catch(function () {});
}

function mandar() {
  var t = document.getElementById('texto').value.trim();
  var aviso = document.getElementById('aviso');
  if (!t) { aviso.textContent = 'cola alguma coisa primeiro 😄'; return; }
  var btn = document.getElementById('enviar');
  btn.disabled = true;
  aviso.textContent = '';
  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json',
               'x-admin-key': chaveAtual() },
    body: JSON.stringify({ texto: t })
  }).then(function (r) {
    if (r.status === 401) { semChave(); throw new Error('chave'); }
    return r.json();
  }).then(function () {
    document.getElementById('texto').value = '';
    aviso.textContent = 'na caixinha! 📬';
    setTimeout(function () { aviso.textContent = ''; }, 2500);
    carregar();
  }).catch(function () {
    aviso.textContent = 'não foi — tenta de novo?';
  }).finally(function () { btn.disabled = false; });
}

var PAINEL = 'https://quxzjsnjgpisepslcpnc.supabase.co/functions/v1/painel';

function metrica(n, l) {
  return '<div><div style="font-size:22px;font-weight:700">' + n +
    '</div><div class="dica" style="margin:2px 0 0">' + l + '</div></div>';
}

function carregarEngine() {
  fetch(PAINEL, { headers: { 'x-admin-key': chaveAtual() } })
    .then(function (r) {
      if (r.status === 401) { semChave(); throw new Error('chave'); }
      return r.json();
    })
    .then(function (d) {
      var L = d.leituras_24h || {};
      var rate = L.ben_rate == null ? '—' : Math.round(L.ben_rate * 100) + '%';
      var cong = Object.keys(d.ritmo_congelador || {}).sort(function(a,b){
        return parseInt(a) - parseInt(b);
      }).map(function (k) {
        return k + ': <b>' + d.ritmo_congelador[k] + '</b>';
      }).join(' · ');
      document.getElementById('engine').innerHTML =
        metrica(L.total || 0, 'leituras 24h (' + (L.eventos_colhidos || 0) + ' eventos)') +
        metrica(rate, 'ben-rate 📉 US$' + (L.custo_estimado_usd || 0) +
          ' <s>' + (L.custo_se_tudo_hiker_usd || 0) + '</s>') +
        metrica((d.triagem || {}).pendentes || 0, 'triagem pendente (' +
          ((d.triagem || {}).resolvidos_24h || 0) + ' resolvidos 24h)') +
        metrica((d.radar || {}).casas_com_endereco_social || 0,
          'casas no radar 🛰️ (' + ((d.antena || {}).casas_com_handle || 0) + ' com IG)') +
        '<div style="grid-column:1/3" class="dica">ritmo de leitura → ' +
        (cong || '—') + '</div>';
    })
    .catch(function () {});
}

function iniciar() {
  if (!chaveAtual()) {
    document.getElementById('portao').style.display = 'block';
    return;
  }
  document.getElementById('portao').style.display = 'none';
  document.getElementById('painel').style.display = 'block';
  carregar();
  carregarEngine();
}
iniciar();
</script>
</body>
</html>
